{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Добавить новый сервис</h4>
            </div>
            <div class="card-body">
                <form action="/add-service" method="post">
                    <div class="mb-3">
                        <label class="form-label">Название</label>
                        <input type="text" name="name" class="form-control" placeholder="Напр: Мой Сайт" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL адрес</label>
                        <input type="url" name="url" class="form-control" placeholder="https://example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Интервал проверки (мин)</label>
                        <input type="number" name="check_interval" class="form-control" value="5" min="1" max="60">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Сохранить и запустить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
